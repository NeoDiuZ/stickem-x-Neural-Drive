<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Sony PSP Recreation</title>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #2a2a2e; /* Dark background to showcase the silver device */
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
            box-sizing: border-box;
            overflow: hidden;
        }

        svg#psp-svg {
            width: 100%;
            max-width: 1000px; /* Max width for large displays */
            height: auto;
            display: block;
            /* A soft shadow to lift the device off the page */
            filter: drop-shadow(0 20px 25px rgba(0,0,0,0.25));
        }

        /* --- Interactivity --- */

        .psp-btn:hover {
            /* Gently elevate the button on hover */
            transform: translateY(-1px);
            cursor: pointer;
        }

        /* Set a default state for the "off" hold light */
        #led-hold {
            fill: #402800; /* Dark, off-amber */
            filter: none;
        }
        
        /* Define the "on" state for the hold light */
        #led-hold.hold-on {
            fill: #F7941D; /* Bright amber */
            filter: url(#ledGlowAmber);
        }

        #hold-click-target {
            cursor: pointer;
        }
    </style>
</head>
<body>

    <svg id="psp-svg"
         xmlns="http://www.w3.org/2000/svg"
         xmlns:xlink="http://www.w3.org/1999/xlink"
         viewBox="0 0 1200 504"
         preserveAspectRatio="xMidYMid meet">
        
        <defs>
            <linearGradient id="bodyGradient" x1="0.5" y1="0" x2="0.5" y2="1">
                <stop offset="0%" stop-color="#E8EAED" />
                <stop offset="100%" stop-color="#D7DBE0" />
            </linearGradient>

            <filter id="bodyNoiseFilter">
                <feTurbulence type="fractalNoise" baseFrequency="0.4" numOctaves="3" stitchTiles="stitch" />
                <feColorMatrix type="saturate" values="0"/>
                <feComponentTransfer>
                    <feFuncA type="linear" slope="0.1" /> </feComponentTransfer>
                <feBlend in="SourceGraphic" mode="multiply" />
            </filter>
            
            <clipPath id="bodyClip">
                <path d="
                    M 96,0
                    C 360,5.04 840,5.04 1104,0
                    C 1158,0 1200,30.24 1200,70.56
                    C 1200,151.2 1182,312.48 1176,413.28
                    C 1170,463.68 1128,504 1080,504
                    C 840,514.08 360,514.08 120,504
                    C 72,504 24,463.68 24,413.28
                    C 12,302.4 0,151.2 0,70.56
                    C 0,30.24 42,0 96,0
                    Z
                "/>
            </clipPath>
            
            <linearGradient id="shoulderHighlight" x1="0.5" y1="0" x2="0.5" y2="1">
                <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
                <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.0" />
            </linearGradient>

            <filter id="innerShadowScreen" x="-10%" y="-10%" width="120%" height="120%">
                <feOffset dx="0" dy="2"/>
                <feGaussianBlur stdDeviation="3" result="offset-blur"/>
                <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
                <feFlood flood-color="#000" flood-opacity="0.2" result="color"/>
                <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
                <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
            </filter>
            
            <linearGradient id="screenGloss" x1="0.5" y1="0" x2="0.5" y2="1">
                <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
                <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.0" />
            </linearGradient>

            <filter id="btnEmboss">
                <feOffset dx="-1" dy="-1" />
                <feGaussianBlur stdDeviation="1" result="offset-blur-dark" />
                <feComposite operator="out" in="SourceGraphic" in2="offset-blur-dark" result="inverse-dark" />
                <feFlood flood-color="#000" flood-opacity="0.15" result="color-dark" />
                <feComposite operator="in" in="color-dark" in2="inverse-dark" result="shadow-dark" />
                
                <feOffset dx="1" dy="1" />
                <feGaussianBlur stdDeviation="1" result="offset-blur-light" />
                <feComposite operator="out" in="SourceGraphic" in2="offset-blur-light" result="inverse-light" />
                <feFlood flood-color="#FFF" flood-opacity="0.25" result="color-light" />
                <feComposite operator="in" in="color-light" in2="inverse-light" result="shadow-light" />
                
                <feMerge>
                    <feMergeNode in="shadow-dark" />
                    <feMergeNode in="shadow-light" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>
            
            <filter id="pillShadow">
                <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.2" />
            </filter>
            
            <filter id="ledGlowGreen">
                <feGaussianBlur stdDeviation="3" result="coloredBlur" />
                <feMerge>
                    <feMergeNode in="coloredBlur" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>
            
            <filter id="ledGlowAmber">
                <feGaussianBlur stdDeviation="3" result="coloredBlur" />
                <feMerge>
                    <feMergeNode in="coloredBlur" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>

        </defs>

        <g id="chassis">
            <path id="pspBody"
                  d="
                    M 96,0
                    C 360,5.04 840,5.04 1104,0
                    C 1158,0 1200,30.24 1200,70.56
                    C 1200,151.2 1182,312.48 1176,413.28
                    C 1170,463.68 1128,504 1080,504
                    C 840,514.08 360,514.08 120,504
                    C 72,504 24,463.68 24,413.28
                    C 12,302.4 0,151.2 0,70.56
                    C 0,30.24 42,0 96,0
                    Z
                  "
                  fill="url(#bodyGradient)" />
            
            <rect x="0" y="0" width="1200" height="504"
                  filter="url(#bodyNoiseFilter)"
                  clip-path="url(#bodyClip)" />
            
            <rect x="0" y="0" width="1200" height="504"
                  fill="url(#shoulderHighlight)"
                  clip-path="url(#bodyClip)" />
        </g>
        
        <g id="screen-assembly">
            <rect x="298" y="70" width="604" height="364" rx="16"
                  fill="none"
                  filter="url(#innerShadowScreen)" />
                  
            <rect id="screen"
                  x="300" y="72" width="600" height="360" rx="14.4"
                  fill="#0A0A0A" />
            
            <rect id="screen-gloss"
                  x="300" y="72" width="600" height="360" rx="14.4"
                  fill="url(#screenGloss)" />
        </g>
        
        <g id="left-controls">
            <g id="dpad" fill="#D7DBE0" stroke="#9AA0A6" stroke-width="0.5">
                <circle cx="168" cy="126" r="90" fill="#CDD1D5" stroke="none" opacity="0.5" />
                
                <g class="psp-btn" filter="url(#btnEmboss)">
                    <rect x="-22.8" y="-22.8" width="45.6" height="45.6" rx="4.56"
                          transform="translate(168, 72) rotate(45)" />
                    <rect x="-22.8" y="-22.8" width="45.6" height="45.6" rx="4.56"
                          transform="translate(168, 180) rotate(45)" />
                    <rect x="-22.8" y="-22.8" width="45.6" height="45.6" rx="4.56"
                          transform="translate(114, 126) rotate(45)" />
                    <rect x="-22.8" y="-22.8" width="45.6" height="45.6" rx="4.56"
                          transform="translate(222, 126) rotate(45)" />
                </g>
            </g>
            
            <g id="analog-nub" class="psp-btn">
                <circle cx="132" cy="181.44" r="54" fill="#D7DBE0" filter="url(#btnEmboss)" />
                <g id="analog-texture" fill="#9AA0A6" opacity="0.6">
                    <circle cx="172.5" cy="181.44" r="3" />
                    <circle cx="160.5" cy="210" r="3" />
                    <circle cx="132" cy="221.44" r="3" />
                    <circle cx="103.5" cy="210" r="3" />
                    <circle cx="91.5" cy="181.44" r="3" />
                    <circle cx="103.5" cy="152.88" r="3" />
                    <circle cx="132" cy="141.44" r="3" />
                    <circle cx="160.5" cy="152.88" r="3" />
                    <circle cx="153.4" cy="181.44" r="2.5" />
                    <circle cx="148.6" cy="198.8" r="2.5" />
                    <circle cx="132" cy="203.44" r="2.5" />
                    <circle cx="115.3" cy="198.8" r="2.5" />
                    <circle cx="110.6" cy="181.44" r="2.5" />
                    <circle cx="115.3" cy="164.08" r="2.5" />
                    <circle cx="132" cy="159.44" r="2.5" />
                    <circle cx="148.6" cy="164.08" r="2.5" />
                </g>
            </g>
            
            <g id="indicators-left" fill="#6F7C85" stroke="none">
                 <path d="M 72 312 
                         A 12 12 0 0 1 84 324
                         L 78 324 A 6 6 0 0 0 72 318 Z" opacity="0.3" />
                <path d="M 72 315 
                         A 8 8 0 0 1 80 323 
                         L 77 323 A 5 5 0 0 0 72 318 Z" />
                <circle cx="72" cy="324" r="2" />
                
                <circle id="led-power-left" cx="42" cy="30" r="7.2" fill="#00E000" filter="url(#ledGlowGreen)" />
                <circle cx="42" cy="30" r="4" fill="#20FF20" />

                <circle id="led-hold-left" cx="42" cy="48" r="7.2" class="" />
                <circle cx="42" cy="48" r="4" fill="#FFC040" opacity="0.5" />
                
                <rect id="hold-click-target-left" x="30" y="36" width="24" height="24" fill="transparent" />
            </g>
        </g>
        
        <g id="right-controls">
            <g id="face-buttons" fill="#D7DBE0" stroke-width="2.5" stroke="#9AA0A6">
                <circle cx="1032" cy="126" r="90" fill="#CDD1D5" stroke="none" opacity="0.5" />
                
                <g class="psp-btn" filter="url(#btnEmboss)">
                    <g transform="translate(1032, 72)">
                        <circle cx="0" cy="0" r="33.6" />
                        <path d="M 0 -18 L 15.6 9 L -15.6 9 Z" fill="none" />
                    </g>
                    <g transform="translate(1086, 126)">
                        <circle cx="0" cy="0" r="33.6" />
                        <circle cx="0" cy="0" r="15" fill="none" />
                    </g>
                    <g transform="translate(1032, 180)">
                        <circle cx="0" cy="0" r="33.6" />
                        <path d="M -12 -12 L 12 12 M -12 12 L 12 -12" fill="none" />
                    </g>
                    <g transform="translate(978, 126)">
                        <circle cx="0" cy="0" r="33.6" />
                        <rect x="-13" y="-13" width="26" height="26" fill="none" />
                    </g>
                </g>
            </g>
            
            <g id="leds-right">
                <circle id="led-power" cx="1164" cy="292.32" r="7.2" fill="#00E000" filter="url(#ledGlowGreen)" />
                <circle cx="1164" cy="292.32" r="4" fill="#20FF20" /> <circle id="led-hold" cx="1164" cy="322.56" r="7.2" /> <circle cx="1164" cy="322.56" r="4" fill="#FFC040" opacity="0.5" /> <rect id="hold-click-target" x="1152" y="310" width="24" height="24" fill="transparent" />
            </g>
        </g>
        
        <g id="bottom-controls" filter="url(#pillShadow)">
            <g class="psp-btn" id="btn-home">
                <rect x="330" y="453.6" width="60" height="20.16" ry="10.08" fill="#D7DBE0" />
                <text x="360" y="465.68" fill="#9AA0A6" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">HOME</text>
            </g>
            <g class="psp-btn" id="btn-vol-minus">
                <rect x="378" y="453.6" width="60" height="20.16" ry="10.08" fill="#D7DBE0" />
                <text x="408" y="465.68" fill="#9AA0A6" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">VOL -</text>
            </g>
            <g class="psp-btn" id="btn-vol-plus">
                <rect x="432" y="453.6" width="60" height="20.16" ry="10.08" fill="#D7DBE0" />
                <text x="462" y="465.68" fill="#9AA0A6" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">VOL +</text>
            </g>
            <g class="psp-btn" id="btn-music">
                <rect x="726" y="453.6" width="60" height="20.16" ry="10.08" fill="#D7DBE0" />
                <text x="756" y="465.68" fill="#9AA0A6" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">♪</text>
            </g>
            <g class="psp-btn" id="btn-select">
                <rect x="810" y="453.6" width="60" height="20.16" ry="10.08" fill="#D7DBE0" />
                <text x="840" y="465.68" fill="#9AA0A6" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">SELECT</text>
            </g>
            <g class="psp-btn" id="btn-start">
                <rect x="864" y="453.6" width="60" height="20.16" ry="10.08" fill="#D7DBE0" />
                <text x="894" y="465.68" fill="#9AA0A6" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">START</text>
            </g>
        </g>
        
        <g id="branding" fill="#6F7C85" font-family="sans-serif" text-anchor="middle">
            <text x="960" y="36" font-size="20" font-weight="bold" letter-spacing="1">SONY</text>
            
            <g transform="translate(60 126)">
                <path d="M 0 -18 
                         C 10 -18 16 -12 16 -4 
                         C 16 4 10 10 0 10 
                         C 0 14 2 18 6 18 
                         L 6 24 C -4 24 -8 18 -8 10 
                         C -8 -10 -20 -14 -20 -24 
                         L -14 -24 C -14 -16 -8 -12 -8 -4 
                         C -8 4 -4 10 0 10 Z"
                      fill="#9AA0A6" />
            </g>
            
            <text x="600" y="468" font-size="18" font-weight="bold" letter-spacing="4">P S P</text>
        </g>
        
    </svg>

    <script>
        /*
        ======================================================================
        == Layout Computation & Design Variables
        ======================================================================
        
        This comment block explains the variables used to generate the static
        SVG coordinates above, as requested.
        
        W = 1200 (Base Width)
        H = 504 (Base Height, 0.42 * W)

        --- Body Shoulder Path Tuning ---
        
        The 'd' attribute for the path `#pspBody` and `<clipPath id="bodyClip">`
        is built from these 8 anchor points (A-H) and their corresponding
        cubic Bézier control points.
        
        * To adjust the *top shoulder bulge*, modify:
            * Bc2 (0.965*W, 0)
            * Cc1 (W, 0.06*H)
            * Hc2 (0, 0.06*H)
            * Ac2 (0.035*W, 0)
            
        * To adjust the *bottom corner scoop*, modify:
            * Dc2 (0.975*W, 0.92*H)
            * Ec1 (0.94*W, H)
            * Fc2 (0.06*W, H)
            * Gc1 (0.02*W, 0.92*H)
        
        * To adjust the *top/bottom edge bowing*, modify:
            * Ac1, Bc1 (top bow)
            * Ec2, Fc1 (bottom bow)

        (The static values in the path are pre-calculated from this logic)
        */
        
        // This object demonstrates how values were derived, fulfilling the "layout object" requirement.
        const layout = {
            W: 1200,
            H: 1200 * 0.42, // 504
            
            bodyPath: {
                A:   { x: 0.08 * 1200, y: 0 },            // 96, 0
                Ac1: { x: 0.30 * 1200, y: 0.01 * 504 },   // 360, 5.04
                B:   { x: 0.92 * 1200, y: 0 },            // 1104, 0
                Bc1: { x: 0.70 * 1200, y: 0.01 * 504 },   // 840, 5.04
                Bc2: { x: 0.965 * 1200, y: 0 },           // 1158, 0
                C:   { x: 1200, y: 0.14 * 504 },          // 1200, 70.56
                Cc1: { x: 1200, y: 0.06 * 504 },          // 1200, 30.24
                Cc2: { x: 1200, y: 0.30 * 504 },          // 1200, 151.2
                D:   { x: 0.98 * 1200, y: 0.82 * 504 },   // 1176, 413.28
                Dc1: { x: 0.985 * 1200, y: 0.62 * 504 },  // 1182, 312.48
                Dc2: { x: 0.975 * 1200, y: 0.92 * 504 },  // 1170, 463.68
                E:   { x: 0.90 * 1200, y: 504 },          // 1080, 504
                Ec1: { x: 0.94 * 1200, y: 504 },          // 1128, 504
                Ec2: { x: 0.70 * 1200, y: 1.02 * 504 },   // 840, 514.08
                F:   { x: 0.10 * 1200, y: 504 },          // 120, 504
                Fc1: { x: 0.30 * 1200, y: 1.02 * 504 },   // 360, 514.08
                Fc2: { x: 0.06 * 1200, y: 504 },          // 72, 504
                G:   { x: 0.02 * 1200, y: 0.82 * 504 },   // 24, 413.28
                Gc1: { x: 0.02 * 1200, y: 0.92 * 504 },   // 24, 463.68
                Gc2: { x: 0.01 * 1200, y: 0.60 * 504 },   // 12, 302.4
                H:   { x: 0, y: 0.14 * 504 },             // 0, 70.56
                Hc1: { x: 0, y: 0.30 * 504 },             // 0, 151.2
                Hc2: { x: 0, y: 0.06 * 504 },             // 0, 30.24
                Ac2: { x: 0.035 * 1200, y: 0 }            // 42, 0
            },
            
            screen: {
                w: 0.50 * 1200, // 600
                h: 0.30 * 1200, // 360
                r: 0.012 * 1200, // 14.4
                x: (1200 - 600) / 2, // 300
                y: (504 - 360) / 2  // 72
            },
            
            dpad: {
                cx: 0.14 * 1200, // 168
                cy: 0.25 * 504,  // 126
                ringR: 0.075 * 1200, // 90
                btnSize: 0.038 * 1200, // 45.6
                btnDist: 54, // Manual value for placement (0.6 * ringR)
            },

            analog: {
                cx: 0.11 * 1200, // 132
                cy: 0.36 * 504,  // 181.44
                r: 0.045 * 1200 // 54
            },
            
            faceButtons: {
                cx: 0.86 * 1200, // 1032
                cy: 0.25 * 504,  // 126
                ringR: 0.075 * 1200, // 90
                btnR: 0.028 * 1200, // 33.6
                btnDist: 54, // Manual value for placement
            },
            
            leds: {
                green_cy: 0.58 * 504, // 292.32
                amber_cy: 0.64 * 504, // 322.56
                cx: 0.97 * 1200, // 1164
                r: 0.006 * 1200 // 7.2
            },
            
            bottomButtons: {
                w: 0.05 * 1200, // 60
                h: 0.04 * 504,  // 20.16
                ry: (0.04 * 504) / 2, // 10.08
                top_y: (0.92 * 504) - ( (0.04 * 504) / 2 ), // 453.6
                text_y: (0.92 * 504) + 2, // 465.68 (center + small fudge)
                cx: [0.30, 0.34, 0.37, 0.63, 0.70, 0.77] // % W
            }
        };

        /*
        ======================================================================
        == Interactivity
        ======================================================================
        */
        document.addEventListener('DOMContentLoaded', () => {
            let isHoldOn = false;
            
            // Get all hold-related elements
            const holdLedRight = document.getElementById('led-hold');
            const holdLedLeft = document.getElementById('led-hold-left');
            const clickTargetRight = document.getElementById('hold-click-target');
            const clickTargetLeft = document.getElementById('hold-click-target-left');

            function toggleHold() {
                isHoldOn = !isHoldOn;
                
                // Toggle the 'hold-on' class on both LEDs
                holdLedRight.classList.toggle('hold-on', isHoldOn);
                holdLedLeft.classList.toggle('hold-on', isHoldOn);
            }

            // Add click listeners to both targets
            clickTargetRight.addEventListener('click', toggleHold);
            clickTargetLeft.addEventListener('click', toggleHold);
        });
    </script>
</body>
</html>
